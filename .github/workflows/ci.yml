name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          for f in $(find src -name '*.js' | sort); do node --check "$f"; done
          [ -f client.js ] && node --check client.js || true
      - name: Smoke tests
        run: node --test test/
